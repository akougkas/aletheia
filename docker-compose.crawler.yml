services:
  aletheia-app:
    build:
      args:
        ALETHEIA_EXTRAS: "crawler"
    image: aletheia/app:crawler
    environment:
      ALETHEIA_ENABLE_CRAWL4AI_FALLBACK: "1"

  crawler-runtime:
    image: aletheia/app:crawler
    container_name: aletheia-crawler
    command: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALETHEIA_DB_HOST: postgres
      ALETHEIA_DB_PORT: 5432
      ALETHEIA_DB_NAME: ${ALETHEIA_DB_NAME:-aletheia}
      ALETHEIA_DB_USER: ${ALETHEIA_DB_USER:-aletheia}
      ALETHEIA_DB_PASSWORD: ${ALETHEIA_DB_PASSWORD:-aletheia}
      ALETHEIA_ENABLE_CRAWL4AI_FALLBACK: "1"
    volumes:
      - ./:/app
