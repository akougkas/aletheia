[project]
name = "aletheia"
version = "0.1.0"
description = "Methodology-aware multi-agent intelligence for policy data integrity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pgai",
    "psycopg[binary]>=3.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
crawler = [
    "crawl4ai",
]
research = [
    "crawl4ai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "integration: requires live Postgres and seeded benchmark data",
]
