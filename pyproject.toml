[project]
name = "aletheia"
version = "0.1.0"
description = "Methodology-aware multi-agent intelligence for policy data integrity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pgai[vectorizer-worker]",
    "psycopg[binary]>=3.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.7.0",
    "pypdf>=6.7.1",
    "scipy>=1.17.0",
    "numpy>=2.4.2",
    "statsmodels>=0.14.6",
    "crawl4ai",
]

[project.scripts]
aletheia = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "integration: requires live Postgres and seeded benchmark data",
]
