name: aletheia

services:
  # --- ALWAYS ON ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aletheia-db
    environment:
      POSTGRES_USER: ${ALETHEIA_DB_USER:-aletheia}
      POSTGRES_PASSWORD: ${ALETHEIA_DB_PASSWORD:-aletheia}
      POSTGRES_DB: ${ALETHEIA_DB_NAME:-aletheia}
    ports:
      - "${ALETHEIA_DB_PORT:-5432}:5432"
    volumes:
      - aletheia_pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALETHEIA_DB_USER:-aletheia}"]
      interval: 5s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  vectorizer-worker:
    image: timescale/pgai-vectorizer-worker:latest
    container_name: aletheia-vectorizer
    environment:
      PGAI_VECTORIZER_WORKER_DB_URL: postgres://${ALETHEIA_DB_USER:-aletheia}:${ALETHEIA_DB_PASSWORD:-aletheia}@postgres:5432/${ALETHEIA_DB_NAME:-aletheia}
      OPENAI_API_KEY: ${ALETHEIA_VECTORIZER_API_KEY:-not-needed}
      OPENAI_BASE_URL: ${ALETHEIA_VECTORIZER_EMBED_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- PROFILE: ollama (CPU) ---
  ollama:
    image: ollama/ollama:latest
    container_name: aletheia-ollama
    profiles: [ollama]
    ports:
      - "11434:11434"
    volumes:
      - aletheia_ollama_data:/root/.ollama
    restart: unless-stopped

  # --- PROFILE: gpu (Ollama + NVIDIA) ---
  ollama-gpu:
    image: ollama/ollama:latest
    container_name: aletheia-ollama
    profiles: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - aletheia_ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${OLLAMA_GPU_COUNT:-1}
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  aletheia_pgdata:
  aletheia_ollama_data:
