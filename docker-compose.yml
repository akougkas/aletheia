name: aletheia

services:
  # --- ALWAYS ON ---
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: aletheia-db
    command: start rocksdb:/data/aletheia.db --user root --pass root --bind 0.0.0.0:8000
    ports:
      - "${ALETHEIA_SURREAL_PORT:-8000}:8000"
    volumes:
      - aletheia_surreal_data:/data
    healthcheck:
      test: ["CMD", "surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- PROFILE: ollama (CPU) ---
  ollama:
    image: ollama/ollama:latest
    container_name: aletheia-ollama
    profiles: [ollama]
    ports:
      - "11434:11434"
    volumes:
      - aletheia_ollama_data:/root/.ollama
    restart: unless-stopped

  # --- PROFILE: gpu (Ollama + NVIDIA) ---
  ollama-gpu:
    image: ollama/ollama:latest
    container_name: aletheia-ollama
    profiles: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - aletheia_ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${OLLAMA_GPU_COUNT:-1}
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  aletheia_surreal_data:
  aletheia_ollama_data:
