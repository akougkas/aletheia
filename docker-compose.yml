services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aletheia-db
    environment:
      POSTGRES_USER: aletheia
      POSTGRES_PASSWORD: aletheia
      POSTGRES_DB: aletheia
    ports:
      - "${ALETHEIA_DB_PORT:-5432}:5432"
    volumes:
      - aletheia_pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheia"]
      interval: 5s
      timeout: 5s
      retries: 5

  vectorizer-worker:
    image: timescale/pgai-vectorizer-worker:latest
    container_name: aletheia-vectorizer
    environment:
      PGAI_VECTORIZER_WORKER_DB_URL: postgres://aletheia:aletheia@postgres:5432/aletheia
      OPENAI_API_KEY: "not-needed"
      OPENAI_BASE_URL: "http://mini:8080/v1"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aletheia_pgdata:
