name: aletheia

services:
  aletheia-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ALETHEIA_EXTRAS: ""
    image: aletheia/app:core
    container_name: aletheia-app
    command: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALETHEIA_DB_HOST: postgres
      ALETHEIA_DB_PORT: 5432
      ALETHEIA_DB_NAME: ${ALETHEIA_DB_NAME:-aletheia}
      ALETHEIA_DB_USER: ${ALETHEIA_DB_USER:-aletheia}
      ALETHEIA_DB_PASSWORD: ${ALETHEIA_DB_PASSWORD:-aletheia}
      ALETHEIA_LLM_BASE_URL: ${ALETHEIA_LLM_BASE_URL:-http://host.docker.internal:1234}
      ALETHEIA_EMBED_BASE_URL: ${ALETHEIA_EMBED_BASE_URL:-http://host.docker.internal:1234}
      ALETHEIA_WEB_SEARCH_PROVIDER: ${ALETHEIA_WEB_SEARCH_PROVIDER:-auto}
      ALETHEIA_WEB_SEARCH_CHAIN: ${ALETHEIA_WEB_SEARCH_CHAIN:-brave,duckduckgo}
      ALETHEIA_ENABLE_CRAWL4AI_FALLBACK: ${ALETHEIA_ENABLE_CRAWL4AI_FALLBACK:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aletheia-db
    environment:
      POSTGRES_USER: ${ALETHEIA_DB_USER:-aletheia}
      POSTGRES_PASSWORD: ${ALETHEIA_DB_PASSWORD:-aletheia}
      POSTGRES_DB: ${ALETHEIA_DB_NAME:-aletheia}
    ports:
      - "${ALETHEIA_DB_PORT:-5432}:5432"
    volumes:
      - aletheia_pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALETHEIA_DB_USER:-aletheia}"]
      interval: 5s
      timeout: 5s
      retries: 8

  vectorizer-worker:
    image: timescale/pgai-vectorizer-worker:latest
    container_name: aletheia-vectorizer
    environment:
      PGAI_VECTORIZER_WORKER_DB_URL: postgres://${ALETHEIA_DB_USER:-aletheia}:${ALETHEIA_DB_PASSWORD:-aletheia}@postgres:5432/${ALETHEIA_DB_NAME:-aletheia}
      OPENAI_API_KEY: ${ALETHEIA_VECTORIZER_API_KEY:-not-needed}
      OPENAI_BASE_URL: ${ALETHEIA_VECTORIZER_EMBED_BASE_URL:-http://host.docker.internal:1234/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aletheia_pgdata:
